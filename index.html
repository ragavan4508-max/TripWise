<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripWise – Smart Travel Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loader" class="loader">
    <div class="loader-box">
      <div class="plane" aria-hidden="true">✈</div>
      <h2>TripWise</h2>
      <p id="loader-text">Finding great destinations…</p>
      <div class="bar"><div id="bar-fill"></div></div>
    </div>
  </div>

  <header>
    <h1>TripWise</h1>
    <nav>
      <button id="tab-explore" class="tab active">Explore</button>
      <button id="tab-trip" class="tab">My Trip <span id="count">0</span></button>
    </nav>
  </header>

  <main>
    <!-- EXPLORE VIEW -->
    <section id="explore">
      <div class="controls">
        <input id="search" type="search" placeholder="Search destinations (e.g. Paris, Japan, Chennai)…">
        <select id="region"><option value="">All countries</option></select>
        <select id="sort">
          <option value="name">Name A–Z</option>
          <option value="pop-desc">Population: high to low</option>
          <option value="pop-asc">Population: low to high</option>
        </select>
      </div>
      <p id="status" role="status"></p>
      <div id="grid" class="grid"></div>
    </section>

    <!-- MY TRIP VIEW -->
    <section id="trip" hidden>
      <h2>My Trip</h2>
      <div id="trip-list" class="grid"></div>
    </section>
  </main>

  <!-- DETAILS VIEW (modal) -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button id="close" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>Data: Open-Meteo &amp; Wikipedia</footer>
  <script src="app.js"></script>
</body>
</html>
